[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesify-jax"
version = "0.1.0"
description = "Gaussian moment layers and explicit EP/MFVI messages in JAX"
requires-python = ">=3.10"
dependencies = ["jax==0.4.38", "flax==0.10.4", "optax==0.2.4", "numpy", "scipy"]

[project.optional-dependencies]
tutorial = ["matplotlib", "pandas", "nbformat", "nbclient", "ipykernel", "nbconvert", "beautifulsoup4"]
data = ["datasets==4.8.5", "transformers==5.22.1", "huggingface-hub==1.33.0", "safetensors==0.8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bayesify_jax = ["assets/*.npz"]
