name: Package release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify the combined archive
        run: python site/package.py
      - name: Publish the archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Bayesify $GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi
          gh release upload "$GITHUB_REF_NAME" output/releases/Bayesify_v*.zip output/releases/Bayesify_v*.sha256 --clobber
